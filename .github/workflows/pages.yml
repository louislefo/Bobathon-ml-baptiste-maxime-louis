name: Deploy Website and Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'data/*.html'
      - 'docs/figures/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Prepare static assets
        run: |
          mkdir -p website/static/reports website/static/figures
          cp docs/figures/* website/static/figures/ 2>/dev/null || true
          cp data/*.html website/static/reports/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Build Docusaurus site
        run: |
          cd website
          npm run build
        env:
          BASE_URL: '/Bobathon-ml-baptiste-maxime-louis/'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
